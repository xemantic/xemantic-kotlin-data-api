# Builds main branch and deploys SNAPSHOT versions to Maven Central
name: Build main

on:
  push:
    branches:
      - main

jobs:
  build:
    uses: xemantic/.github/.github/workflows/build-gradle.yml@main
    secrets: inherit
    with:
      gradle_args: build publishToMavenCentral --no-configuration-cache
      maven_central: true

  # Every compiler the release will publish for, verified on main rather than at release time —
  # a variant that stopped compiling is otherwise discovered while cutting a release.
  kotlinc_matrix:
    uses: ./.github/workflows/kotlinc-matrix.yml

  compiler_variants:
    needs: kotlinc_matrix
    strategy:
      fail-fast: false
      matrix:
        kotlinc_version: ${{ fromJSON(needs.kotlinc_matrix.outputs.versions) }}
    uses: xemantic/.github/.github/workflows/build-gradle.yml@main
    secrets: inherit
    with:
      gradle_args: -PkotlincVersion=${{ matrix.kotlinc_version }} :xemantic-kotlin-data-api-compiler-plugin:test
